<aside>
<h1>LUKAZII Layer Lab</h1><div class="sub">online v0.4-lite · auto-save · layer stack</div>
<p class="hint">線上版先放這裡。這版可以細調圖層疊加、線條粗細、線段數量、模糊、顆粒、粒子與色彩，並可匯出 JSON 給 Codex / VST。</p>
<div class="tabs"><div class="tab active" data-tab="core">核心</div><div class="tab" data-tab="layers">圖層</div><div class="tab" data-tab="theme">套色</div></div>
<section id="core" class="section active"><div class="group"><h2>VST 07 Core</h2><div class="row"><select id="displayMode"><option>visual</option><option>studio</option></select><select id="visualPreset"><option>topography</option><option>filament</option><option>storm</option><option>custom</option></select><select id="wavePalette"><option>ember</option><option>chalk</option><option>ice</option><option>custom</option></select></div><div class="control"><label>Trail / Clear</label><output id="trailOut"></output><input id="trail" type="range" min="0.01" max="0.9" step="0.01" value="0.12"></div><div class="control"><label>Global Scale</label><output id="scaleOut"></output><input id="scale" type="range" min="0.4" max="2" step="0.01" value="1"></div><div class="control"><label>Audio Response</label><output id="responseOut"></output><input id="response" type="range" min="0" max="3" step="0.01" value="1"></div><div class="control"><label>Rotation</label><output id="rotationOut"></output><input id="rotation" type="range" min="-180" max="180" step="1" value="0"></div></div><div class="group"><h2>Audio</h2><div class="row"><button id="play">Play Demo</button><button id="pause">Pause</button><label class="file">Load Audio<input id="audioFile" type="file" accept="audio/*"></label></div></div></section>
<section id="layers" class="section"><div class="group"><h2>Layer Stack</h2><div id="layerUI"></div></div></section>
<section id="theme" class="section"><div class="group"><h2>Colors</h2><div class="control"><label>Background</label><input id="bg" type="color" value="#050609"></div><div class="control"><label>Foreground</label><input id="fg" type="color" value="#fff7ec"></div><div class="control"><label>Secondary</label><input id="sec" type="color" value="#d7a56a"></div><div class="control"><label>Grid</label><input id="grid" type="color" value="#70412c"></div><div class="control"><label>Accent</label><input id="accent" type="color" value="#ffb25f"></div><div class="control"><label>Accent Mix</label><output id="accentMixOut"></output><input id="accentMix" type="range" min="0" max="1" step="0.01" value="0.24"></div></div><div class="group"><h2>Material</h2><div class="control"><label>Contrast</label><output id="contrastOut"></output><input id="contrast" type="range" min="0.3" max="3" step="0.01" value="1.1"></div><div class="control"><label>Glow</label><output id="glowOut"></output><input id="glow" type="range" min="0" max="2" step="0.01" value="0.2"></div><div class="control"><label>Glow Radius</label><output id="glowRadiusOut"></output><input id="glowRadius" type="range" min="0" max="80" step="1" value="22"></div><div class="control"><label>Paper</label><output id="paperOut"></output><input id="paper" type="range" min="0" max="1" step="0.01" value="0"></div><div class="control"><label>Invert</label><output id="invertOut"></output><input id="invert" type="range" min="0" max="1" step="0.01" value="0"></div></div></section>
<div class="group"><h2>Export</h2><textarea id="json"></textarea><div class="row" style="margin-top:8px"><button id="export">Export JSON</button><button id="copy">Copy</button><button id="reset">Reset Save</button></div></div>
</aside>
<main><header><div><h1>LUKAZII Layer Lab Preview</h1><div class="sub">online visual tuning interface</div></div><div class="sub" id="audioStatus">preview mode</div></header><div id="wrap"><canvas id="c"></canvas><div class="status" id="status">RMS 0.00 · PEAK 0.00</div></div></main>

const blends=['source-over','lighter','screen','multiply','overlay','difference'];function mini(id,k,label,min,max,step){return `<div class=mini><label>${label}</label><output id=L_${id}_${k}Out></output><input id=L_${id}_${k} type=range min=${min} max=${max} step=${step} value=${state[id][k]}></div>`}function buildUI(){let h='';for(const id of layers){h+=`<div class=layer><div class=layerHead><input id=L_${id}_enabled type=checkbox ${state[id].enabled?'checked':''}><b>${id}</b><select id=L_${id}_blend>${blends.map(b=>`<option ${state[id].blend==b?'selected':''}>${b}</option>`).join('')}</select></div><div class=miniGrid>${mini(id,'opacity','opacity',0,1,.01)}${mini(id,'thickness','line',.1,12,.1)}${mini(id,'blur','blur',0,40,1)}${mini(id,'density','density',0,360,1)}${mini(id,'count','count',0,420,1)}${mini(id,'scale','scale',.1,3,.01)}${mini(id,'speed','speed',0,3,.01)}${mini(id,'jitter','jitter',0,3,.01)}${mini(id,'response','response',0,4,.01)}</div></div>`} $('layerUI').innerHTML=h;bindLayer()}function bindLayer(){for(const id of layers){$(`L_${id}_enabled`).oninput=e=>{state[id].enabled=e.target.checked;save()};$(`L_${id}_blend`).oninput=e=>{state[id].blend=e.target.value;save()};['opacity','thickness','blur','density','count','scale','speed','jitter','response'].forEach(k=>{$(`L_${id}_${k}`).oninput=e=>{state[id][k]=+e.target.value;sync();save()}})}}

const c=$('c'),ctx=c.getContext('2d',{alpha:false});let ac,an,src,osc,td,fd,playing=false,t=0,last=performance.now(),prevPeak=0;function resize(){const d=Math.min(devicePixelRatio||1,2),r=c.parentElement.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;c.style.width=r.width+'px';c.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function rgb(h){const n=parseInt(h.slice(1),16);return{r:n>>16&255,g:n>>8&255,b:n&255}}function rgba(h,a){const c=rgb(h);return`rgba(${c.r},${c.g},${c.b},${Math.max(0,Math.min(1,a))})`}function mix(a,b,t){const A=rgb(a),B=rgb(b);return`rgb(${Math.round(A.r+(B.r-A.r)*t)},${Math.round(A.g+(B.g-A.g)*t)},${Math.round(A.b+(B.b-A.b)*t)})`}function lerp(a,b,t){return a+(b-a)*t}
